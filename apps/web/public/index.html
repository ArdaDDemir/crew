<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crew</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <p class="logo">Crew</p>
      <p class="rail-label">Channels</p>
      <nav id="channel-list" class="nav"></nav>
      <p class="rail-label">Direct</p>
      <nav id="dm-list" class="nav"></nav>
      <p class="rail-label">People</p>
      <nav id="people" class="people"></nav>
      <p class="meta" id="meta"></p>
    </aside>
    <section class="chat">
      <header class="chat-top">
        <div>
          <span class="kicker" id="room-kicker">channel</span>
          <h1 id="room-title">#landing</h1>
        </div>
      </header>
      <div class="thread" id="thread">
        <ol class="log" id="log"></ol>
      </div>
      <div class="dock">
        <form class="composer" id="composer">
          <textarea id="draft" rows="1" placeholder="Message #landing" required></textarea>
          <div class="dock-row">
            <select id="mode" title="Permission mode">
              <option value="supervised">supervised</option>
              <option value="auto-accept" selected>auto-accept</option>
              <option value="auto">auto</option>
              <option value="full-access">full-access</option>
            </select>
            <button type="button" class="chip" id="model-btn" title="Model">model</button>
            <button type="button" class="chip" id="thinking-btn" aria-pressed="false">thinking</button>
            <button type="button" class="chip" id="tools-btn" aria-pressed="false">tools</button>
            <button type="submit" id="send">Send</button>
          </div>
        </form>
      </div>
    </section>
  </div>
  <dialog id="model-modal" class="modal">
    <form method="dialog" id="model-form">
      <p class="modal-title">Model</p>
      <div id="model-list" class="model-list"></div>
      <input id="model-custom" type="text" placeholder="openrouter model id" />
      <div class="modal-actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" id="model-save">Use</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
