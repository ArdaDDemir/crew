[package]
name = "crew-desktop"
version = "0.12.3"
description = "Crew office window"
authors = ["Arda"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "Crew"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
